[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pep-lqr"
version = "1.1.0"
description = "Worst-case LTI perturbations of finite-horizon LQR: a Performance Estimation Problem approach"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Anthony Couthures" },
    { name = "Gianluca Bianchin" },
    { name = "Julien M. Hendrickx" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "cvxpy>=1.4",
    "matplotlib>=3.7",
    "ipywidgets>=8.0",
    "ipython",
]

[tool.setuptools]
packages = ["pep_lqr"]
